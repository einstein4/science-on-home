<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Science On · 과학 앱 모음</title>
  <meta name="description" content="직접 만든 과학 학습 앱을 한곳에 모았습니다." />
  <!-- 파비콘: 상단 로고와 같은 토글 스위치 모양 (#은 URL 안에서 %23으로 적어야 함) -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect x='2' y='8.5' width='28' height='15' rx='7.5' fill='%231b6ef3'/><circle cx='22.5' cy='16' r='5' fill='%23fff'/><circle cx='22.5' cy='16' r='1.8' fill='%231b6ef3'/></svg>" />
  <!-- 한글 글꼴 Pretendard: 페이지에 쓰인 글자만 골라 받는 dynamic-subset 버전이라 가볍다 -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <style>
    /* 색상 변수: 여기만 바꾸면 페이지 전체 색이 바뀐다 */
    :root {
      --bg: #ffffff;
      --surface: #ffffff;
      --surface-2: #f6f8fb;          /* 마우스를 올린 줄, 하단바 배경 */
      --text: #1f1f1f;               /* 본문 글자: 순검정보다 살짝 부드럽게 */
      --muted: #5e6470;              /* 설명 글자: 기존보다 대비를 조금 올림 */
      --line: #e3e6eb;
      --blue: #1b6ef3;               /* 대표 색 (로고·링크) */
      --blue-hover: #1559c9;
      --knob: #ffffff;               /* 로고 토글의 동그라미 색 */
      --hero-glow: rgba(27,110,243,.08); /* 첫 화면 뒤의 옅은 파란 빛 */
      /* 아이콘 동그라미 4색: 밝기·채도를 맞춰 한 세트처럼 보이게 */
      --blue-soft: #e7effd;
      --red-soft: #fde9e7;
      --yellow-soft: #fdf3dc;
      --green-soft: #e5f5ea;
      --shadow: 0 1px 2px rgba(60,64,67,.3), 0 2px 6px 2px rgba(60,64,67,.15);
    }
    /* 기기가 다크 모드일 때 같은 변수들을 어두운 값으로 덮어쓴다 */
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #17181b;
        --surface: #202124;
        --surface-2: #232529;
        --text: #eceef1;
        --muted: #9ba1ab;
        --line: #33363c;
        --blue: #7fb0ff;
        --blue-hover: #a6c8ff;
        --knob: #17181b;             /* 다크 모드에선 동그라미를 배경색으로 → 구멍 뚫린 느낌 */
        --hero-glow: rgba(127,176,255,.10);
        --blue-soft: #233350;
        --red-soft: #45282a;
        --yellow-soft: #42381f;
        --green-soft: #1f3a2a;
        --shadow: 0 1px 3px rgba(0,0,0,.5), 0 4px 8px 3px rgba(0,0,0,.25);
      }
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      /* Pretendard가 못 불러와지면 뒤의 시스템 글꼴로 대신 표시 */
      font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    .wrap { max-width: 1040px; margin: 0 auto; padding: 0 24px; }

    /* 상단 바 */
    header { border-bottom: 1px solid var(--line); background: var(--bg); }
    .bar { display: flex; align-items: center; height: 64px; }
    .logo { display: flex; align-items: center; gap: 10px; font-size: 21px; font-weight: 500; color: var(--text); letter-spacing: -0.02em; }
    .logo b { font-weight: 700; }
    .on { color: var(--blue); }      /* "On" 글자는 토글과 같은 파란색 */
    .mark { width: 32px; height: 32px; flex: none; }
    .mark .track, .mark .dot { fill: var(--blue); }  /* 토글 막대와 가운데 점 */
    .mark .knob { fill: var(--knob); }               /* 오른쪽(켜짐) 동그라미 */

    /* 첫 화면: 위쪽 가운데에 옅은 파란 빛을 깔아 밋밋함을 줄인다 */
    .hero {
      text-align: center; padding: 88px 0 56px;
      background: radial-gradient(60% 80% at 50% 0%, var(--hero-glow), transparent 70%);
    }
    .hero h1 { font-size: clamp(40px, 7vw, 64px); font-weight: 700; letter-spacing: -0.035em; margin: 0; }

    /* 앱 목록 */
    section { padding: 24px 0 64px; }
    .section-title { font-size: 22px; font-weight: 400; margin: 0 0 8px; }
    .list { border-top: 1px solid var(--line); }
    .item {
      display: flex; align-items: flex-start; gap: 16px;
      padding: 20px 8px; border-bottom: 1px solid var(--line);
      transition: background .15s;
    }
    a.item:hover { background: var(--surface-2); }
    .item-icon {
      width: 40px; height: 40px; border-radius: 50%; flex: none;
      display: grid; place-items: center; font-size: 20px;
      background: var(--blue-soft);
    }
    .list > :nth-child(4n+2) .item-icon { background: var(--red-soft); }
    .list > :nth-child(4n+3) .item-icon { background: var(--yellow-soft); }
    .list > :nth-child(4n+4) .item-icon { background: var(--green-soft); }
    .item-body { flex: 1; min-width: 0; align-self: center; }
    .item h3 { font-size: 17px; font-weight: 600; letter-spacing: -0.01em; margin: 0 0 4px; }
    .item h3:last-child { margin-bottom: 0; }
    .item p { font-size: 14px; color: var(--muted); margin: 0; }
    .open { flex: none; align-self: center; font-size: 14px; font-weight: 600; color: var(--blue); }
    a.item:hover .open { color: var(--blue-hover); }
    .item.soon { opacity: .6; }
    .item.soon .item-icon { filter: grayscale(1); }
    .item.soon .open { color: var(--muted); }

    footer { background: var(--surface-2); border-top: 1px solid var(--line); padding: 20px 0; font-size: 14px; color: var(--muted); }

    @media (max-width: 600px) {
      .hero { padding: 56px 0 40px; }
      .item { padding: 16px 4px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap bar">
      <!-- 로고: 켜진 토글 스위치(= On) + 동그라미 안의 점(= 원자/세포 느낌) -->
      <a href="#" class="logo"><svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><rect class="track" x="2" y="8.5" width="28" height="15" rx="7.5" /><circle class="knob" cx="22.5" cy="16" r="5" /><circle class="dot" cx="22.5" cy="16" r="1.8" /></svg><span><b>Science</b> <span class="on">On</span></span></a>
    </div>
  </header>

  <main class="wrap">
    <div class="hero">
      <h1>Science <span class="on">On</span></h1>
    </div>

    <section id="apps">
      <h2 class="section-title">앱 목록</h2>
      <div class="list" id="grid"></div>
    </section>
  </main>

  <footer>
    <div class="wrap">© <span id="year"></span> Science On</div>
  </footer>

  <script>
    // ▼ 앱을 추가·수정하려면 이 목록만 고치면 됩니다.
    //   url이 비어 있으면 "준비 중"으로 표시됩니다.
    const APPS = [
      {
        name: "체세포분열 카드 게임",
        desc: "",
        icon: "🧬",
        url: "https://card.science-on.kr",
      },
      {
        name: "온도 실험 그래프",
        desc: "USB·무선 온도센서를 연결해 20분 동안의 온도 변화를 실시간 그래프로 기록합니다.",
        icon: "🌡️",
        url: "https://temperature-graph-nine.vercel.app",
      },
      {
        name: "새 앱 준비 중",
        desc: "다음 과학 앱을 만들고 있습니다.",
        icon: "🧪",
        url: "",
      },
      {
        name: "새 앱 준비 중",
        desc: "다음 과학 앱을 만들고 있습니다.",
        icon: "🧲",
        url: "",
      },
    ];

    const grid = document.getElementById("grid");

    function renderGrid() {
      grid.innerHTML = "";
      APPS.forEach(a => {
        const ready = Boolean(a.url);
        const el = document.createElement(ready ? "a" : "div");
        el.className = "item" + (ready ? "" : " soon");
        if (ready) { el.href = a.url; el.target = "_blank"; el.rel = "noopener"; }
        el.innerHTML = `
          <div class="item-icon">${a.icon}</div>
          <div class="item-body">
            <h3></h3>
            <p></p>
          </div>
          <span class="open">${ready ? "열기 →" : "준비 중"}</span>`;
        el.querySelector("h3").textContent = a.name;
        if (a.desc) el.querySelector("p").textContent = a.desc;
        else el.querySelector("p").remove();
        grid.appendChild(el);
      });
    }

    document.getElementById("year").textContent = new Date().getFullYear();
    renderGrid();
  </script>
</body>
</html>
