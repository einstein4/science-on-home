<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Science On · 과학 앱 모음</title>
  <meta name="description" content="직접 만든 과학 학습 앱을 한곳에 모았습니다." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔬</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Roboto:wght@400;500;700&display=swap" />
  <style>
    :root {
      --bg: #ffffff;
      --surface: #ffffff;
      --surface-2: #f8f9fa;
      --text: #202124;
      --muted: #5f6368;
      --line: #dadce0;
      --blue: #1a73e8;
      --blue-hover: #1765cc;
      --blue-soft: #e8f0fe;
      --red-soft: #fce8e6;
      --yellow-soft: #fef7e0;
      --green-soft: #e6f4ea;
      --shadow: 0 1px 2px rgba(60,64,67,.3), 0 2px 6px 2px rgba(60,64,67,.15);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #202124;
        --surface: #292a2d;
        --surface-2: #303134;
        --text: #e8eaed;
        --muted: #9aa0a6;
        --line: #3c4043;
        --blue: #8ab4f8;
        --blue-hover: #aecbfa;
        --blue-soft: #2d3a4f;
        --red-soft: #4a2c2a;
        --yellow-soft: #4a3f20;
        --green-soft: #22402c;
        --shadow: 0 1px 3px rgba(0,0,0,.5), 0 4px 8px 3px rgba(0,0,0,.25);
      }
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Google Sans", Roboto, "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", Arial, sans-serif;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    .wrap { max-width: 1040px; margin: 0 auto; padding: 0 24px; }

    /* 상단 바 */
    header { border-bottom: 1px solid var(--line); background: var(--bg); }
    .bar { display: flex; align-items: center; height: 64px; }
    .logo { display: flex; align-items: center; gap: 10px; font-size: 22px; font-weight: 400; color: var(--muted); letter-spacing: -0.01em; }
    .logo b { color: var(--text); font-weight: 500; }
    .dots { display: grid; grid-template-columns: repeat(2, 8px); gap: 3px; }
    .dots i { width: 8px; height: 8px; border-radius: 50%; }
    .dots i:nth-child(1) { background: #4285f4; }
    .dots i:nth-child(2) { background: #ea4335; }
    .dots i:nth-child(3) { background: #fbbc04; }
    .dots i:nth-child(4) { background: #34a853; }

    /* 첫 화면 */
    .hero { text-align: center; padding: 88px 0 56px; }
    .hero h1 { font-size: clamp(40px, 7vw, 64px); font-weight: 400; letter-spacing: -0.02em; margin: 0 0 16px; }
    .hero p { font-size: 18px; color: var(--muted); margin: 0 auto 32px; max-width: 520px; }
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      height: 44px; padding: 0 24px; border-radius: 999px;
      background: var(--blue); color: #fff; font-size: 15px; font-weight: 500;
      transition: background .2s, box-shadow .2s;
    }
    @media (prefers-color-scheme: dark) { .btn { color: #202124; } }
    .btn:hover { background: var(--blue-hover); box-shadow: var(--shadow); }

    /* 앱 목록 */
    section { padding: 24px 0 64px; }
    .section-title { font-size: 22px; font-weight: 400; margin: 0 0 20px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
    .card {
      display: flex; flex-direction: column;
      background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
      padding: 24px; transition: box-shadow .2s, border-color .2s;
    }
    a.card:hover { box-shadow: var(--shadow); border-color: transparent; }
    .card-icon {
      width: 56px; height: 56px; border-radius: 50%;
      display: grid; place-items: center; font-size: 26px; margin-bottom: 20px;
    }
    .grid > :nth-child(4n+1) .card-icon { background: var(--blue-soft); }
    .grid > :nth-child(4n+2) .card-icon { background: var(--red-soft); }
    .grid > :nth-child(4n+3) .card-icon { background: var(--yellow-soft); }
    .grid > :nth-child(4n+4) .card-icon { background: var(--green-soft); }
    .card h3 { font-size: 18px; font-weight: 500; margin: 0 0 8px; }
    .card p { font-size: 14px; color: var(--muted); margin: 0 0 20px; flex: 1; }
    .open { align-self: flex-start; font-size: 14px; font-weight: 500; color: var(--blue); padding: 8px 12px; margin: 0 -12px -8px; border-radius: 999px; }
    a.card:hover .open { background: var(--blue-soft); }
    .card.soon { background: var(--surface-2); border-color: transparent; }
    .card.soon .card-icon { filter: grayscale(1); opacity: .6; }
    .card.soon .open { color: var(--muted); }

    footer { background: var(--surface-2); border-top: 1px solid var(--line); padding: 20px 0; font-size: 14px; color: var(--muted); }

    @media (max-width: 600px) {
      .hero { padding: 56px 0 40px; }
      .hero p { font-size: 16px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap bar">
      <a href="#" class="logo"><span class="dots"><i></i><i></i><i></i><i></i></span><span><b>Science</b> On</span></a>
    </div>
  </header>

  <main class="wrap">
    <div class="hero">
      <h1>Science On</h1>
      <p>직접 만든 과학 학습 앱을 한곳에 모았습니다. 원하는 앱을 골라 바로 시작해 보세요.</p>
      <a href="#apps" class="btn">앱 둘러보기</a>
    </div>

    <section id="apps">
      <h2 class="section-title">앱 목록</h2>
      <div class="grid" id="grid"></div>
    </section>
  </main>

  <footer>
    <div class="wrap">© <span id="year"></span> Science On</div>
  </footer>

  <script>
    // ▼ 앱을 추가·수정하려면 이 목록만 고치면 됩니다.
    //   url이 비어 있으면 "준비 중"으로 표시됩니다.
    const APPS = [
      {
        name: "체세포분열 카드 게임",
        desc: "체세포분열 5단계를 빠르게 구분하는 반응속도 카드 게임입니다.",
        icon: "🧬",
        url: "https://card.science-on.kr",
      },
      {
        name: "새 앱 준비 중",
        desc: "다음 과학 앱을 만들고 있습니다.",
        icon: "🧪",
        url: "",
      },
      {
        name: "새 앱 준비 중",
        desc: "다음 과학 앱을 만들고 있습니다.",
        icon: "🧲",
        url: "",
      },
    ];

    const grid = document.getElementById("grid");

    function renderGrid() {
      grid.innerHTML = "";
      APPS.forEach(a => {
        const ready = Boolean(a.url);
        const el = document.createElement(ready ? "a" : "div");
        el.className = "card" + (ready ? "" : " soon");
        if (ready) { el.href = a.url; el.target = "_blank"; el.rel = "noopener"; }
        el.innerHTML = `
          <div class="card-icon">${a.icon}</div>
          <h3></h3>
          <p></p>
          <span class="open">${ready ? "열기" : "준비 중"}</span>`;
        el.querySelector("h3").textContent = a.name;
        el.querySelector("p").textContent = a.desc;
        grid.appendChild(el);
      });
    }

    document.getElementById("year").textContent = new Date().getFullYear();
    renderGrid();
  </script>
</body>
</html>
