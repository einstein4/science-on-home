<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>체세포분열 단계 퀴즈 · Science On</title>
  <meta name="theme-color" content="#2563eb" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icon.svg" />
  <link rel="stylesheet" href="/shared/base.css" />
  <script src="/shared/record.js"></script>
  <script src="/shared/notice.js"></script>
  <style>
    h1 { font-size: 24px; letter-spacing: -0.03em; margin: 28px 0 4px; }
    .progress { height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; margin: 16px 0 20px; }
    .progress i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
    .qnum { font-size: 13px; color: var(--accent); font-weight: 700; }
    .question { font-size: 18px; font-weight: 600; margin: 6px 0 16px; letter-spacing: -0.01em; }
    .choices { display: grid; gap: 8px; }
    .choice {
      text-align: left; padding: 14px 16px; border-radius: 12px; border: 1px solid var(--line);
      background: var(--surface); color: var(--text); font-size: 15px; cursor: pointer;
    }
    .choice:disabled { cursor: default; }
    .choice.correct { border-color: var(--ok); background: var(--ok-soft); color: var(--ok); font-weight: 700; }
    .choice.wrong { border-color: var(--bad); background: var(--bad-soft); color: var(--bad); }
    .explain { margin-top: 14px; padding: 12px 14px; border-radius: 10px; background: var(--bg); font-size: 14px; }
    .next { margin-top: 16px; width: 100%; }
    .result { text-align: center; padding: 28px 20px; }
    .result .big { font-size: 44px; font-weight: 800; letter-spacing: -0.03em; margin: 8px 0; }
    .result .actions { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 18px; }
    .std { font-size: 13px; color: var(--muted); }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="wrap">
      <a href="/" class="logo"><span class="logo-mark">S</span>Science On</a>
      <nav>
        <a href="/#apps">앱</a>
        <a href="/my/">내 성취도</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <h1>🧬 체세포분열 단계 퀴즈</h1>
    <p class="std" id="stdLabel"></p>

    <div id="quiz">
      <div class="progress"><i id="progress"></i></div>
      <div class="panel">
        <div class="qnum" id="qnum"></div>
        <div class="question" id="question"></div>
        <div class="choices" id="choices"></div>
        <div class="explain" id="explain" hidden></div>
        <button class="btn primary next" id="next" hidden>다음</button>
      </div>
    </div>

    <div id="result" class="panel result" hidden>
      <div class="muted">내 점수</div>
      <div class="big" id="score"></div>
      <div id="level"></div>
      <p class="muted small" id="saved"></p>
      <div class="actions">
        <button class="btn" id="retry">다시 풀기</button>
        <a class="btn primary" href="/my/">내 성취도 보기 →</a>
      </div>
    </div>
  </main>

  <script>
    const APP = { id: "cell-division-quiz", name: "체세포분열 단계 퀴즈" };
    // 성취기준 코드는 학교 교육과정 문서로 확인 후 필요하면 수정하세요.
    const STANDARDS = [{ code: "[9과21-02]", title: "체세포 분열과 생식세포 형성 과정" }];

    const STAGES = ["간기", "전기", "중기", "후기", "말기"];
    const QUESTIONS = [
      { q: "DNA가 복제되어 유전 물질의 양이 2배가 되는 시기는?", a: "간기", why: "간기에는 세포가 생장하고 DNA를 복제해 분열을 준비해요." },
      { q: "핵막이 사라지고 막대 모양의 염색체가 나타나기 시작하는 시기는?", a: "전기", why: "전기에는 염색체가 굵고 짧게 뭉쳐 보이기 시작하고 핵막이 사라져요." },
      { q: "염색체가 세포의 중앙에 나란히 배열되는 시기는?", a: "중기", why: "중기에는 염색체가 세포 중앙에 배열되어 모양과 수를 관찰하기 가장 좋아요." },
      { q: "염색체의 수와 모양을 관찰하기 가장 좋은 시기는?", a: "중기", why: "염색체가 가장 굵게 뭉쳐 중앙에 배열되는 중기가 관찰에 가장 좋아요." },
      { q: "염색 분체가 분리되어 세포의 양쪽 끝으로 이동하는 시기는?", a: "후기", why: "후기에는 방추사에 끌려 염색 분체가 양극으로 나뉘어 이동해요." },
      { q: "핵막이 다시 나타나고 두 개의 핵이 만들어지는 시기는?", a: "말기", why: "말기에는 염색체가 풀어지고 핵막이 다시 생기며, 세포질 분열이 일어나요." },
      { q: "방추사가 나타나기 시작하는 시기는?", a: "전기", why: "전기에 방추사가 만들어지기 시작해 염색체에 붙어요." },
      { q: "식물 세포에서 세포판이 만들어지며 세포질이 나뉘는 시기는?", a: "말기", why: "말기에 식물 세포는 세포판이, 동물 세포는 세포막이 안쪽으로 오목하게 들어가며 세포질이 나뉘어요." },
    ];

    const $ = (id) => document.getElementById(id);
    let order = [], idx = 0, correct = 0;

    function shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function start() {
      order = shuffle(QUESTIONS);
      idx = 0;
      correct = 0;
      $("quiz").hidden = false;
      $("result").hidden = true;
      show();
    }

    function show() {
      const item = order[idx];
      $("progress").style.width = (idx / order.length) * 100 + "%";
      $("qnum").textContent = `문제 ${idx + 1} / ${order.length}`;
      $("question").textContent = item.q;
      $("explain").hidden = true;
      $("next").hidden = true;
      const box = $("choices");
      box.innerHTML = "";
      STAGES.forEach((stage) => {
        const b = document.createElement("button");
        b.className = "choice";
        b.textContent = stage;
        b.onclick = () => answer(stage, b);
        box.appendChild(b);
      });
    }

    function answer(stage, btn) {
      const item = order[idx];
      const ok = stage === item.a;
      if (ok) correct++;
      [...$("choices").children].forEach((b) => {
        b.disabled = true;
        if (b.textContent === item.a) b.classList.add("correct");
      });
      if (!ok) btn.classList.add("wrong");
      $("explain").textContent = (ok ? "⭕ 정답! " : `❌ 정답은 ${item.a}. `) + item.why;
      $("explain").hidden = false;
      $("next").textContent = idx + 1 < order.length ? "다음" : "결과 보기";
      $("next").hidden = false;
      $("next").focus();
    }

    $("next").onclick = () => {
      idx++;
      if (idx < order.length) show();
      else finish();
    };

    function finish() {
      $("progress").style.width = "100%";
      $("quiz").hidden = true;
      $("result").hidden = false;
      const percent = Math.round((correct / order.length) * 100);
      $("score").textContent = `${correct} / ${order.length}`;
      const level = ScienceOn.levelOf(percent);
      $("level").innerHTML = "";
      const badge = document.createElement("span");
      badge.textContent = `${percent}% · ${level.label}`;
      badge.style.cssText = "font-weight:700;color:var(--" + ({ done: "ok", near: "warn", try: "bad" })[level.key] + ")";
      $("level").appendChild(badge);

      const saved = ScienceOn.saveResult({ app: APP.id, appName: APP.name, score: correct, max: order.length, standards: STANDARDS });
      $("saved").textContent = saved
        ? "이 휴대폰에 기록을 저장했어요."
        : "기록을 저장하지 못했어요. 시크릿 모드인지 확인해 주세요.";
    }

    $("retry").onclick = start;
    $("stdLabel").textContent = "성취기준 " + STANDARDS.map((s) => `${s.code} ${s.title}`).join(", ");
    start();
  </script>
</body>
</html>
